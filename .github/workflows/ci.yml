name: Build, scan, publish and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, notifier]
        include:
          - service: api
            dockerfile: Dockerfile.multi
          - service: notifier
            dockerfile: Dockerfile
    env:
      CONTEXT: ./docker-demo-api-starter-main/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/${{ matrix.dockerfile }}
          tags: ${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy (gate on v* tags only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.service }} image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # Deploiement SIMULE : pas de VM, la "cible" est le runner GitHub lui-meme.
  # Meme mecanique qu'en prod (login ghcr, compose pull, compose up -d),
  # mais sans SSH. Pour une vraie cible, remplacer ces etapes par un ssh
  # lancant les memes commandes.
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: docker-demo-api-starter-main
    env:
      POSTGRES_USER: demo
      POSTGRES_DB: demo
      DB_PASSWORD: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute version and image prefix
        run: |
          echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (docker compose pull && up -d)
        run: |
          docker compose pull api notifier
          docker compose up -d --no-build
          docker compose ps

      - name: Smoke test (api + notifier actif)
        run: |
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/ready && break || sleep 3
          done
          curl -fsS -X POST localhost:8080/products -H "Content-Type: application/json"             -d '{"name":"Clavier meca","price_cents":5900}'
          sleep 2
          docker compose logs notifier | tail -5
          docker compose logs notifier | grep -q "notification received"

      - name: Tear down
        if: always()
        run: docker compose down -v
