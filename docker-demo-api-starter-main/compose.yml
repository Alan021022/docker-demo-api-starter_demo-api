services:
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/alan021022/docker-demo-api-starter_demo-api}/api:${TAG:-latest}
    build:
      context: ./api
      dockerfile: Dockerfile.multi
    ports:
      - "${API_PORT:-8080}:3000"
    environment:
      NOTIFIER_URL: http://notifier:3001
      PGHOST: db
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER}"
      PGDATABASE: "${POSTGRES_DB}"
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks: [front, back]
    depends_on:
      db:
        condition: service_healthy
      notifier:
        condition: service_started
    restart: unless-stopped

  notifier:
    image: ${IMAGE_PREFIX:-ghcr.io/alan021022/docker-demo-api-starter_demo-api}/notifier:${TAG:-latest}
    build:
      context: ./notifier
    environment:
      PORT: "3001"
    networks: [back]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [back]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks: [front, back]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  front:
  back:

volumes:
  pgdata:

secrets:
  db_password:
    environment: DB_PASSWORD
